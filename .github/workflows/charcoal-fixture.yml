name: Charcoal instrumentation fixture
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: isomorphisms/ai-ci/.github/actions/charcoal-vendor@ff34c4100bc7063aab245f8088b4abee77df3e3a
        with:
          header: '-'
          resources: dexmaker-mockito-inline-extended-tests/src/androidTest/res
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platforms;android-32 build-tools;36.0.0'
      - name: Build the existing instrumentation APK with its explicit window theme
        run: ./gradlew :dexmaker-mockito-inline-extended-tests:assembleDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dexmaker-charcoal-instrumentation-fixture
          path: dexmaker-mockito-inline-extended-tests/build/outputs/apk/androidTest/
          if-no-files-found: warn
